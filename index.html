<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Хорошего дня! 💖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffe0e9, #ffb6c1, #ff69b4);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ================= ПАДАЮЩИЕ ЭЛЕМЕНТЫ ================= */
    .falling-item {
      position: absolute;
      top: -50px;
      font-size: 30px;
      animation: fall linear infinite;
      z-index: 1;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0.5; }
    }

    /* ================= ПЛАВАЮЩИЕ КАРТИНКИ НА ФОНЕ ================= */
    .floating-pic {
      position: absolute;
      z-index: 0; /* Позади карточки с текстом, но поверх фона */
      pointer-events: none;
      opacity: 0.8;
      /* Анимация плавания */
      animation: floatAround ease-in-out infinite alternate;
    }

    @keyframes floatAround {
      0% { transform: translateY(0) translateX(0) rotate(-5deg); }
      100% { transform: translateY(-50px) translateX(30px) rotate(5deg); }
    }

    /* ================= КАРТОЧКА С ТЕКСТОМ ================= */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 90%;
      width: 400px;
      z-index: 10;
      position: relative;
      border: 3px solid #fff;
    }

    .card h1 {
      font-size: 28px;
      line-height: 1.4;
      font-weight: 800;
      background: linear-gradient(45deg, #ff1493, #ff8c00, #ff1493, #ff69b4);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: textGradient 4s ease infinite;
      margin-bottom: 20px;
    }

    @keyframes textGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card p {
      color: #d81b60;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.5;
    }

    .heart-beat {
      display: inline-block;
      font-size: 40px;
      margin-top: 20px;
      animation: beat 1s infinite alternate;
    }

    @keyframes beat {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- Карточка с текстом -->
  <div class="card">
    <h1>Хорошего дня, отличного настроения, почаще улыбайся и молись чтобы мне деньги с неба падали</h1>
    <p>Ты лучшая! ✨</p>
    <div class="heart-beat">💖</div>
  </div>

  <script>
    // ====== 1. ГЕНЕРАЦИЯ ПАДАЮЩИХ ДЕНЕГ И СМАЙЛИКОВ ======
    const emojis = ['💸', '💰', '💵', '💖', '✨', '😊', '🥰', '🌸', '🤑'];
    const body = document.body;

    function createFallingItem() {
      const el = document.createElement('div');
      el.classList.add('falling-item');
      
      el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (20 + Math.random() * 30) + 'px';
      
      const duration = 3 + Math.random() * 5;
      el.style.animationDuration = duration + 's';
      el.style.animationDelay = (Math.random() * 5) + 's';

      body.appendChild(el);

      setTimeout(() => {
        el.remove();
      }, (duration + 5) * 1000);
    }

    setInterval(createFallingItem, 300);
    for (let i = 0; i < 15; i++) {
      setTimeout(createFallingItem, i * 100);
    }

    // ====== 2. РАЗМНОЖЕНИЕ ВАШЕЙ КАРТИНКИ PIC ======
    // ВАЖНО: Убедитесь, что ваша картинка называется pic.png и лежит в корне репозитория
    const picSource = 'pic.png'; 
    const TOTAL_PICS = 25; // Количество копий на фоне

    for (let i = 0; i < TOTAL_PICS; i++) {
      const img = document.createElement('img');
      img.src = picSource;
      img.classList.add('floating-pic');

      // Случайный размер от 60 до 150 пикселей
      const size = 60 + Math.random() * 90;
      img.style.width = size + 'px';

      // Случайная позиция по всему экрану
      img.style.left = Math.random() * 95 + 'vw';
      img.style.top = Math.random() * 95 + 'vh';

      // Случайная скорость плавания (от 6 до 12 секунд)
      const duration = 6 + Math.random() * 6;
      img.style.animationDuration = duration + 's';
      
      // Случайная задержка, чтобы они не начинали двигаться одновременно
      img.style.animationDelay = (Math.random() * 5) + 's';

      // Добавляем на страницу
      body.appendChild(img);
    }
  </script>
</body>
</html>
